spring.application.name=auth-service
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_HOST_PORT:5432}/auth_db
spring.datasource.username=auth_user
spring.datasource.password=auth_pass
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.mail.host=localhost
spring.mail.port=${MAILPIT_SMTP_HOST_PORT:1025}

spring.http.client.connect-timeout=3s
spring.http.client.read-timeout=3s

management.endpoints.web.exposure.include=health,info,prometheus

wallet.auth.frontend-url=${FRONTEND_URL:http://localhost:4200}
wallet.auth.magic-link-ttl=15m
wallet.auth.jwt-ttl=30m
wallet.auth.jwt-secret=${JWT_SECRET:dev-only-jwt-secret-change-me-it-must-be-32-bytes-or-more}
wallet.auth.mail-from=no-reply@wallet.local
wallet.ledger.base-url=http://localhost:8082
wallet.internal-api-key=${INTERNAL_API_KEY:dev-internal-key-change-me}

#---
spring.config.activate.on-profile=docker
spring.datasource.url=jdbc:postgresql://postgres:5432/auth_db
spring.mail.host=mailpit
spring.mail.port=1025
wallet.ledger.base-url=http://ledger-service:8082
