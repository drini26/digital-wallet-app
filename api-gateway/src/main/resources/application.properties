spring.application.name=api-gateway
server.port=8080

spring.threads.virtual.enabled=true

spring.http.client.connect-timeout=3s
spring.http.client.read-timeout=10s
spring.http.client.factory=simple

management.endpoints.web.exposure.include=health

wallet.gateway.auth-uri=http://localhost:8081
wallet.gateway.ledger-uri=http://localhost:8082
wallet.gateway.banking-uri=http://localhost:8083
wallet.gateway.jwt-secret=${JWT_SECRET:dev-only-jwt-secret-change-me-it-must-be-32-bytes-or-more}
wallet.gateway.cors-origin=http://localhost:4200
wallet.gateway.sign-in-requests-per-minute=10

#---
spring.config.activate.on-profile=docker
wallet.gateway.auth-uri=http://auth-service:8081
wallet.gateway.ledger-uri=http://ledger-service:8082
wallet.gateway.banking-uri=http://banking-service:8083
