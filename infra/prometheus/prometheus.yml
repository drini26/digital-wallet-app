# Prometheus configuration for the demo (docker compose starts it; UI at http://localhost:9090).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: docker
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['auth-service:8081']
        labels: { service: auth }
      - targets: ['ledger-service:8082']
        labels: { service: ledger }
      - targets: ['banking-service:8083']
        labels: { service: banking }

  - job_name: intellij
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8081']
        labels: { service: auth }
      - targets: ['host.docker.internal:8082']
        labels: { service: ledger }
      - targets: ['host.docker.internal:8083']
        labels: { service: banking }
