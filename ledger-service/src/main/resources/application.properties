spring.application.name=ledger-service
server.port=8082

spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_HOST_PORT:5432}/ledger_db
spring.datasource.username=ledger_user
spring.datasource.password=ledger_pass
spring.datasource.hikari.maximum-pool-size=20
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.mail.host=localhost
spring.mail.port=${MAILPIT_SMTP_HOST_PORT:1025}

spring.http.client.connect-timeout=3s
spring.http.client.read-timeout=3s

management.endpoints.web.exposure.include=health,info,prometheus

wallet.jwt-secret=${JWT_SECRET:dev-only-jwt-secret-change-me-it-must-be-32-bytes-or-more}
wallet.internal-api-key=${INTERNAL_API_KEY:dev-internal-key-change-me}
wallet.ledger.max-payment-amount=10000.00
wallet.ledger.sweep-reserve-limit=1000.00
wallet.ledger.sweep-partner-id=MOCK_PARTNER_BANK
wallet.ledger.sweep-cron=0 0 23 * * *
wallet.ledger.reconciliation-cron=0 30 23 * * *
wallet.ledger.alert-email=ops@wallet.local
wallet.banking.base-url=http://localhost:8083
wallet.jobs.enabled=true

#---
spring.config.activate.on-profile=docker
spring.datasource.url=jdbc:postgresql://postgres:5432/ledger_db
spring.mail.host=mailpit
spring.mail.port=1025
wallet.banking.base-url=http://banking-service:8083
