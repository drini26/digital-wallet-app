spring.application.name=banking-service
server.port=8083

spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_HOST_PORT:5432}/banking_db
spring.datasource.username=banking_user
spring.datasource.password=banking_pass
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.http.client.connect-timeout=3s
spring.http.client.read-timeout=3s

management.endpoints.web.exposure.include=health,info,prometheus

wallet.jwt-secret=${JWT_SECRET:dev-only-jwt-secret-change-me-it-must-be-32-bytes-or-more}
wallet.internal-api-key=${INTERNAL_API_KEY:dev-internal-key-change-me}
wallet.ledger.base-url=http://localhost:8082
wallet.banking.batch-cron=0 0 10,16 * * MON-FRI
wallet.jobs.enabled=true

#---
spring.config.activate.on-profile=docker
spring.datasource.url=jdbc:postgresql://postgres:5432/banking_db
wallet.ledger.base-url=http://ledger-service:8082
