# The whole Digital Wallet on one machine: docker compose up -d --build

x-service-defaults: &service-defaults
  restart: unless-stopped
  deploy:
    resources:
      limits:
        memory: 512M

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-auth_pass}
      LEDGER_DB_PASSWORD: ${LEDGER_DB_PASSWORD:-ledger_pass}
      BANKING_DB_PASSWORD: ${BANKING_DB_PASSWORD:-banking_pass}
    volumes:
      - ./infra/postgres/init:/docker-entrypoint-initdb.d
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "${MAILPIT_SMTP_HOST_PORT:-1025}:1025"
      - "${MAILPIT_UI_HOST_PORT:-8025}:8025"

  auth-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: infra/docker/service.Dockerfile
      args:
        MODULE: auth-service
        PORT: "8081"
    image: digital-wallet-app/auth-service:local
    environment:
      SPRING_PROFILES_ACTIVE: docker,demo
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-me-it-must-be-32-bytes-or-more}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key-change-me}
      SPRING_DATASOURCE_PASSWORD: ${AUTH_DB_PASSWORD:-auth_pass}
      FRONTEND_URL: http://localhost:${FRONTEND_HOST_PORT:-4200}
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 18
      start_period: 30s

  ledger-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: infra/docker/service.Dockerfile
      args:
        MODULE: ledger-service
        PORT: "8082"
    image: digital-wallet-app/ledger-service:local
    environment:
      SPRING_PROFILES_ACTIVE: docker,demo
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-me-it-must-be-32-bytes-or-more}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key-change-me}
      SPRING_DATASOURCE_PASSWORD: ${LEDGER_DB_PASSWORD:-ledger_pass}
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 18
      start_period: 30s

  banking-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: infra/docker/service.Dockerfile
      args:
        MODULE: banking-service
        PORT: "8083"
    image: digital-wallet-app/banking-service:local
    environment:
      SPRING_PROFILES_ACTIVE: docker,demo
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-me-it-must-be-32-bytes-or-more}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key-change-me}
      SPRING_DATASOURCE_PASSWORD: ${BANKING_DB_PASSWORD:-banking_pass}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 18
      start_period: 30s

  api-gateway:
    <<: *service-defaults
    build:
      context: .
      dockerfile: infra/docker/service.Dockerfile
      args:
        MODULE: api-gateway
        PORT: "8080"
    image: digital-wallet-app/api-gateway:local
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-me-it-must-be-32-bytes-or-more}
    ports:
      - "${GATEWAY_HOST_PORT:-8080}:8080"
    depends_on:
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 18
      start_period: 20s

  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
    image: digital-wallet-app/frontend:local
    restart: unless-stopped
    ports:
      - "${FRONTEND_HOST_PORT:-4200}:80"
    depends_on:
      api-gateway:
        condition: service_healthy

volumes:
  postgres-data:
